name: Compilar APK DIGIACCESS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Java 11 (requerido por el plugin de Android 7.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Compilar APK firmado
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DIGIACCESS-PDA-apk
          path: app/build/outputs/apk/*/release/*.apk

      - name: Publicar versión descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DIGIACCESS PDA 1.0.${{ github.run_number }}
          body: "APK firmado con keystore/key.jks. Compilado desde ${{ github.sha }}."
          files: app/build/outputs/apk/*/release/*.apk
